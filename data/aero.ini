[WING_4]
NAME=REAR							; name of the wing
CHORD=0.18							; length of the wing in meters
SPAN=1.23							; width of the wing in meters. both help determine the frontal area
POSITION=0,0.70,-2.26				; position in x,y,z starting from the CoG
LUT_AOA_CL=wing_rear_AOA_CL.lut		; Coefficient of Lift lookup table
LUT_GH_CL=							; Height aero lift multiplier lookup table
CL_GAIN=1.06						; v1.4 GURNEY config (+25% assumed, UNMEASURED). Baseline no-gurney = 0.85. LUT rescaled x10.9 so L/D unchanged from Ceky
LUT_AOA_CD=wing_rear_AOA_CD.lut		; Coefficient of drag lookup table
LUT_GH_CD=							; Height aero drag multiplier table
CD_GAIN=0.735						; v1.4 GURNEY config: measured +3.6% total drag = wing x1.36. Baseline no-gurney = 0.540. LUT rescaled x10.9 so wing = 11% of total drag (real wing-off = -10..-12%)						; Coefficient of drag multiplier (for easy fine tuning)
ANGLE=6							; sim 6 deg == real 6.5 deg datum (Ceky zero is arbitrary); use deltas only
ZONE_FRONT_CL=0    ; CL=CL/(1.0+ZONE_0_CL*DAMAGE)
ZONE_FRONT_CD=0    ; CD=CD*(1.0+ZONE_0_CD*DAMAGE)
ZONE_REAR_CL=0.14     ; CL=CL/(1.0+ZONE_0_CL*DAMAGE)
ZONE_REAR_CD=0.13     ; CD=CD*(1.0+ZONE_0_CD*DAMAGE)
ZONE_LEFT_CL=0     ; CL=CL/(1.0+ZONE_0_CL*DAMAGE)
ZONE_LEFT_CD=0     ; CD=CD*(1.0+ZONE_0_CD*DAMAGE)
ZONE_RIGHT_CL=0     ; CL=CL/(1.0+ZONE_0_CL*DAMAGE)
ZONE_RIGHT_CD=0     ; CD=CD*(1.0+ZONE_0_CD*DAMAGE)
YAW_CL_GAIN=-0.13