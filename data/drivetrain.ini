[TRACTION]
TYPE=RWD								; Wheel drive. Possible options: FWD (Front Wheel Drive), RWD (Rear Wheel Drive)

[GEARS]
COUNT=6									; forward gears number
GEAR_R=-3.75							; rear gear ratio
; forward gears ratios. must be equal to number of gears defined on count
GEAR_1=2.5	
GEAR_2=1.824
GEAR_3=1.474
GEAR_4=1.250
GEAR_5=1.091
GEAR_6=1.000


FINAL=4.1								; final gear ratio

[DIFFERENTIAL]
POWER=0.30			; Drexler no-preload 45deg ramps — ESTIMATE, validate vs real-car exit telemetry
COAST=0.15			; no-preload = low coast lock — ESTIMATE, validate vs real-car telemetry
PRELOAD=0			; no preload plates fitted — confirmed

[GEARBOX]
CHANGE_UP_TIME=40			; change up time in milliseconds
CHANGE_DN_TIME=60		; change down time in milliseconds
AUTO_CUTOFF_TIME=50			; Auto cutoff time for upshifts in milliseconds, 0 to disable
SUPPORTS_SHIFTER=0		; 1=Car supports shifter, 0=car supports only paddles 
VALID_SHIFT_RPM_WINDOW=800			;range window additional to the precise rev matching rpm that permits gear engage.
CONTROLS_WINDOW_GAIN=0.4			;multiplayer for gas,brake,clutch pedals that permits gear engage on different rev matching rpm. the lower the more difficult.
INERTIA=0.014			; gearbox inertia. default values to 0.02 if not set

[CLUTCH]
MAX_TORQUE=750					; Clutch torque 

[AUTOCLUTCH]
UPSHIFT_PROFILE=NONE ; Name of the autoclutch profile for upshifts. NONE to disable autoclutch on shift up
DOWNSHIFT_PROFILE=NONE ; No autoclutch on downshift — player must use clutch (Drenth sequential)
USE_ON_CHANGES=0 ; Do not override — let profiles control clutch behaviour
MIN_RPM=1000 ; Minimum rpm for autoclutch engadgement
MAX_RPM=2000 ; Maximum rpm for autoclutch engadgement

[UPSHIFT_PROFILE]
POINT_0=30								; Time to reach fully depress clutch
POINT_1=50								; Time to start releasing clutch
POINT_2=70								; Time to reach fully released clutch

[DOWNSHIFT_PROFILE]
POINT_0=10								; Time to reach fully depress clutch
POINT_1=50								; Time to start releasing clutch
POINT_2=70								; Time to reach fully released clutch

[AUTOBLIP]
ELECTRONIC=0							; If =1 then it is a feature of the car and cannot be disabled
POINT_0=10								; Time to reach full level
POINT_1=60								; Time to start releasing gas
POINT_2=70								; Time to reach 0 gas
LEVEL=0.7								; Gas level to be reached