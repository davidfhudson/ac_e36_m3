[HEADER]
VERSION=1
POWER_CURVE=power.lut			; power curve file
COAST_CURVE=FROM_COAST_REF		; coast curve

[ENGINE_DATA]
ALTITUDE_SENSITIVITY=0.1		; sensitivity to altitude
INERTIA=0.14					; engine inertia
LIMITER=7800					; engine rev limiter
LIMITER_HZ=30
MINIMUM=980

[COAST_REF]
RPM=7300						; rev number reference
TORQUE=130						; engine braking torque in Nm at reference RPM
NON_LINEARITY=0					; 0=linear, 1=fully exponential

[COAST_DATA]
COAST0=0
COAST1=0
COAST=0.0000015

[COAST_CURVE]
FILENAME=coast.lut				; coasting curve file

[DAMAGE]
RPM_THRESHOLD=8300				; RPM at which engine starts to take damage
RPM_DAMAGE_K=1					; damage per second per (rpm-threshold)
